<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0388d1">
    <title>Frigle Verification</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #eef7ff;
        --muted: #a7bed6;
        --line: rgba(170, 214, 255, 0.22);
        --panel: rgba(9, 18, 36, 0.72);
        --panel-strong: rgba(10, 24, 48, 0.92);
        --cyan: #24d5ff;
        --blue: #1188ff;
        --violet: #8b63ff;
        --pink: #d652ff;
        --green: #4be3a3;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        align-items: center;
        background:
          radial-gradient(circle at 50% 0%, rgba(240, 250, 255, 0.95) 0 8%, transparent 30%),
          radial-gradient(circle at 10% 8%, rgba(214, 82, 255, 0.76), transparent 28%),
          radial-gradient(circle at 83% 12%, rgba(36, 213, 255, 0.72), transparent 32%),
          radial-gradient(circle at 92% 92%, rgba(55, 255, 177, 0.42), transparent 28%),
          radial-gradient(circle at 12% 95%, rgba(17, 136, 255, 0.56), transparent 30%),
          linear-gradient(150deg, #030613 0%, #06152a 44%, #10172e 100%);
        color: var(--ink);
        display: grid;
        justify-items: center;
        min-height: 100vh;
        overflow: hidden;
        padding: 24px;
      }

      body::before {
        background:
          linear-gradient(90deg, rgba(214, 82, 255, 0.9), rgba(17, 136, 255, 0.8), rgba(75, 227, 163, 0.75)),
          linear-gradient(180deg, transparent, rgba(3, 6, 19, 0.78));
        content: "";
        inset: 0;
        opacity: 0.52;
        pointer-events: none;
        position: fixed;
      }

      body::after {
        background:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.026) 1px, transparent 1px);
        background-size: 36px 36px;
        content: "";
        inset: 0;
        mask-image: radial-gradient(circle, black 0 38%, transparent 72%);
        opacity: 0.42;
        pointer-events: none;
        position: fixed;
      }

      main {
        align-items: center;
        display: flex;
        justify-content: center;
        min-height: calc(100vh - 48px);
        position: relative;
        width: min(100%, 520px);
        z-index: 1;
      }

      .verify-shell {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.04)),
          var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow:
          0 34px 90px rgba(0, 0, 0, 0.48),
          0 0 0 1px rgba(255, 255, 255, 0.04) inset,
          0 0 54px rgba(17, 136, 255, 0.24);
        overflow: hidden;
        padding: 1px;
        width: 100%;
      }

      .verify-panel {
        align-items: center;
        backdrop-filter: blur(22px);
        background:
          radial-gradient(circle at 50% 0%, rgba(91, 170, 255, 0.24), transparent 34%),
          linear-gradient(180deg, rgba(7, 17, 35, 0.86), rgba(7, 13, 25, 0.94));
        border-radius: 27px;
        display: flex;
        flex-direction: column;
        gap: 22px;
        padding: clamp(28px, 7vw, 46px);
        text-align: center;
      }

      .icon-ring {
        align-items: center;
        background:
          radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.95), transparent 34%),
          conic-gradient(from 220deg, var(--pink), var(--blue), var(--cyan), var(--green), var(--violet), var(--pink));
        border-radius: 999px;
        box-shadow:
          0 20px 45px rgba(0, 0, 0, 0.38),
          0 0 34px rgba(36, 213, 255, 0.32);
        display: grid;
        height: 148px;
        justify-items: center;
        padding: 5px;
        width: 148px;
      }

      .icon-ring img {
        aspect-ratio: 1;
        border: 8px solid #071326;
        border-radius: 999px;
        display: block;
        height: 100%;
        object-fit: cover;
        width: 100%;
      }

      .brand {
        display: grid;
        gap: 8px;
        justify-items: center;
      }

      h1 {
        font-size: clamp(34px, 8vw, 56px);
        line-height: 0.96;
        margin: 0;
      }

      .brand-gradient {
        background: linear-gradient(90deg, #c356ff 0%, #6d7cff 42%, #23d5ff 100%);
        background-clip: text;
        color: transparent;
        -webkit-background-clip: text;
      }

      .subtitle {
        color: var(--muted);
        font-size: 17px;
        line-height: 1.5;
        margin: 0;
        max-width: 360px;
      }

      .captcha-box {
        align-items: center;
        background: var(--panel-strong);
        border: 1px solid rgba(125, 202, 255, 0.2);
        border-radius: 18px;
        display: grid;
        justify-items: center;
        min-height: 104px;
        padding: 18px;
        width: min(100%, 340px);
      }

      .status {
        border: 1px solid rgba(167, 190, 214, 0.18);
        border-radius: 999px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.35;
        min-height: 36px;
        padding: 8px 14px;
        width: min(100%, 340px);
      }

      .status[data-state="ok"] {
        border-color: rgba(75, 227, 163, 0.44);
        color: #aef8d9;
      }

      .status[data-state="error"] {
        border-color: rgba(255, 105, 125, 0.48);
        color: #ffc1cb;
      }

      .actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        width: min(100%, 340px);
      }

      button {
        background: linear-gradient(135deg, #046cba, #03a6d7);
        border: 1px solid rgba(165, 226, 255, 0.34);
        border-radius: 14px;
        box-shadow: 0 14px 36px rgba(0, 137, 210, 0.28);
        color: white;
        cursor: pointer;
        font: inherit;
        font-size: 16px;
        font-weight: 750;
        min-height: 48px;
        padding: 12px 20px;
        width: 100%;
      }

      button:disabled {
        cursor: not-allowed;
        filter: grayscale(0.55);
        opacity: 0.55;
      }

      @media (max-width: 430px) {
        body {
          padding: 14px;
        }

        main {
          min-height: calc(100vh - 28px);
        }

        .verify-panel {
          border-radius: 23px;
        }

        .verify-shell {
          border-radius: 24px;
        }

        .icon-ring {
          height: 128px;
          width: 128px;
        }
      }
    </style>
  </head>

          <div class="brand">
            <h1><span class="brand-gradient">Frigle</span></h1>
            <p class="subtitle">Complete the check to continue.</p>
          </div>

          <form id="verify-form" method="post" action="/verify">
            <div class="captcha-box">
              <div
                class="h-captcha"
                data-sitekey="83dc583a-bd7a-4b00-a43e-b7a2c2fcebca"
                data-callback="onCaptchaSuccess"
                data-expired-callback="onCaptchaExpired"
                data-error-callback="onCaptchaError"
              ></div>
            </div>

            <input id="captcha-token" type="hidden" name="h-captcha-response">
            <input id="state-field" type="hidden" name="state">

            <div class="actions">
              <button id="verify-button" type="submit" disabled>Verify</button>
            </div>
          </form>

          <div id="status" class="status" role="status">Waiting for hCaptcha.</div>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById("verify-form");
      const button = document.getElementById("verify-button");
      const statusLine = document.getElementById("status");
      const tokenField = document.getElementById("captcha-token");
      const stateField = document.getElementById("state-field");
      const params = new URLSearchParams(window.location.search);

      stateField.value = params.get("state") || "";

      window.onCaptchaSuccess = function onCaptchaSuccess(token) {
        tokenField.value = token;
        button.disabled = false;
        statusLine.dataset.state = "ok";
        statusLine.textContent = "Ready to verify.";
      };

      window.onCaptchaExpired = function onCaptchaExpired() {
        tokenField.value = "";
        button.disabled = true;
        statusLine.dataset.state = "error";
        statusLine.textContent = "hCaptcha expired. Try again.";
      };

      window.onCaptchaError = function onCaptchaError() {
        tokenField.value = "";
        button.disabled = true;
        statusLine.dataset.state = "error";
        statusLine.textContent = "hCaptcha could not load. Refresh and try again.";
      };

      form.addEventListener("submit", function handleSubmit(event) {
        if (!tokenField.value) {
          event.preventDefault();
          statusLine.dataset.state = "error";
          statusLine.textContent = "Complete hCaptcha first.";
        }
      });
    </script>
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
